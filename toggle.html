<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
</head>
<body>
    <button onclick="showToast()" class="bg-blue-500 text-white px-4 py-2 rounded">Show Toast</button>
    <div id="toast" class="hidden fixed top-4 right-4 bg-green-500 text-white p-4 rounded shadow-lg z-50">This is a decent toast notification!</div>
    <script>
        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }
    </script>
</body>
</html>
